# Builds the Windows (64/32-bit) and Linux binaries and publishes them as a
# GitHub release.
#
# The C translation in gen/ is generated from the game's executable, which is
# not part of this repository. The build downloads SLUS_209.10 from the
# private pareidolico/eod-decomp repository with the EOD_DECOMP_TOKEN secret
# (a fine-grained personal access token with read-only "Contents" access to
# that repository) and deletes it again after generating the code. Neither the
# executable nor the generated sources are uploaded anywhere.
#
# Run it from the Actions tab ("Run workflow"; a tag such as v1.0 makes a
# version release with dist/release-notes.md, an empty tag a build-<n>
# prerelease), or push a tag named v*.

name: Release builds

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0 (leave empty for a build-<run number> prerelease)"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  SLUS_SHA256: 4f60053dc141365f5ae50737622f8408be30ced513b4c109427c926461f2e2ae

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win64
            toolchain: cmake/mingw-x86_64.cmake
            strip: x86_64-w64-mingw32-strip
            archive: eod-win64.zip
          - target: win32
            toolchain: cmake/mingw-i686.cmake
            strip: i686-w64-mingw32-strip
            archive: eod-win32.zip
          - target: linux-x86_64
            toolchain: ""
            strip: strip
            archive: eod-linux-x86_64.tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
          if [ "${{ matrix.target }}" != linux-x86_64 ]; then
            sudo apt-get install -y --no-install-recommends mingw-w64
          fi
          python -m pip install rabbitizer==1.16.2

      - name: Fetch SLUS_209.10
        env:
          TOKEN: ${{ secrets.EOD_DECOMP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::The EOD_DECOMP_TOKEN secret is not set (see the comment at the top of this workflow)."
            exit 1
          fi
          code=$(curl -sSL -o SLUS_209.10 -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/pareidolico/eod-decomp/contents/SLUS_209.10?ref=main")
          if [ "$code" != 200 ]; then
            repo=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" \
              https://api.github.com/repos/pareidolico/eod-decomp)
            case "$code/$repo" in
              401/*) echo "::error::EOD_DECOMP_TOKEN is invalid or expired (HTTP 401).";;
              */404) echo "::error::EOD_DECOMP_TOKEN cannot see pareidolico/eod-decomp. Give the token access to that repository (fine-grained: Repository access -> eod-decomp; classic: the 'repo' scope).";;
              */200) echo "::error::EOD_DECOMP_TOKEN can see eod-decomp but not its files (HTTP $code). Give it the 'Contents: Read-only' permission.";;
              *) echo "::error::Downloading SLUS_209.10 failed (HTTP $code, repository check HTTP $repo).";;
            esac
            exit 1
          fi
          echo "$SLUS_SHA256  SLUS_209.10" | sha256sum -c -

      - name: Generate sources
        run: |
          python tools/analyze.py
          python tools/recomp.py
          python tools/vurecomp.py
          rm SLUS_209.10

      - name: Configure
        run: |
          args="-DCMAKE_BUILD_TYPE=Release"
          if [ -n "${{ matrix.toolchain }}" ]; then
            args="$args -DCMAKE_TOOLCHAIN_FILE=${{ matrix.toolchain }}"
          fi
          cmake -S . -B build -G Ninja $args

      - name: Build
        run: cmake --build build --parallel

      - name: Package
        run: |
          mkdir -p pkg out
          cp dist/README.txt pkg/
          if [ "${{ matrix.target }}" = linux-x86_64 ]; then
            ${{ matrix.strip }} -o pkg/eod build/eod
            tar czf out/${{ matrix.archive }} -C pkg eod README.txt
          else
            ${{ matrix.strip }} -o pkg/eod.exe build/eod.exe
            ${{ matrix.strip }} -o pkg/eodsetup.exe build/eodsetup.exe
            (cd pkg && zip -9 -q ../out/${{ matrix.archive }} eod.exe eodsetup.exe README.txt)
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: out/${{ matrix.archive }}
          retention-days: 3

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4  # dist/release-notes.md

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="build-$GITHUB_RUN_NUMBER"
          fi
          cd out
          sha256sum eod-win64.zip eod-win32.zip eod-linux-x86_64.tar.gz > SHA256SUMS
          files="eod-win64.zip eod-win32.zip eod-linux-x86_64.tar.gz SHA256SUMS"
          case "$tag" in
            v*)  # a version: full release with the notes from dist/release-notes.md
              sed "s/@VERSION@/${tag#v}/g; s/@COMMIT@/${GITHUB_SHA::7}/g" ../dist/release-notes.md > notes.md
              gh release create "$tag" $files --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                --title "Version ${tag#v}" --notes-file notes.md --latest
              ;;
            *)
              cat > notes.md <<EOF
          Development build of the native PC port, from commit ${GITHUB_SHA::7}.

          The game is **not** included: you need your own copy of the NTSC-U disc (SLUS_209.10, v1.00). Copy the whole disc into a folder and put \`eod.exe\` there. See README.txt inside the archive.

          * \`eod-win64.zip\`: Windows 7 or later, 64-bit (recommended)
          * \`eod-win32.zip\`: Windows 7 or later, 32-bit
          * \`eod-linux-x86_64.tar.gz\`: headless Linux test build
          EOF
              gh release create "$tag" $files --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                --title "$tag" --notes-file notes.md --prerelease
              ;;
          esac
