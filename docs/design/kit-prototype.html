<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creation Kit Prototype</title>
<!-- Clickable prototype of the Creation Kit redesign (docs/KIT_UX_REDESIGN.md).
     Names and numbers come from the retail disc via tools/kit_prototype_data.py; no images or game text. -->
<style>
:root{
  --bg:#f5f5f7;--win:#ffffff;--side:#ececef;--line:#d9d9de;--text:#1d1d1f;--sub:#6e6e73;--faint:#a1a1a6;
  --accent:#0a6cff;--accent-soft:#e5efff;--ok:#1f8a3b;--warn:#b25000;--warn-soft:#fff3e6;--dot:#ff9f0a;
  --field:#ffffff;--hover:#e2e2e7;--sel:#d4e3ff;--shadow:0 12px 40px rgba(0,0,0,.18);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111113;--win:#1e1e20;--side:#252528;--line:#3a3a3e;--text:#f2f2f4;--sub:#a1a1a6;--faint:#6e6e73;
  --accent:#3d8bff;--accent-soft:#1d2d4a;--ok:#4cc46b;--warn:#ffa64d;--warn-soft:#3a2a17;--dot:#ff9f0a;
  --field:#2a2a2d;--hover:#303034;--sel:#2a4170;--shadow:0 12px 40px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111113;--win:#1e1e20;--side:#252528;--line:#3a3a3e;--text:#f2f2f4;--sub:#a1a1a6;--faint:#6e6e73;
  --accent:#3d8bff;--accent-soft:#1d2d4a;--ok:#4cc46b;--warn:#ffa64d;--warn-soft:#3a2a17;--dot:#ff9f0a;
  --field:#2a2a2d;--hover:#303034;--sel:#2a4170;--shadow:0 12px 40px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;padding:24px 16px}
button{font:inherit;color:inherit}
.window{max-width:1360px;margin:0 auto;background:var(--win);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-rows:52px 1fr auto;height:860px}
/* toolbar */
.toolbar{display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--win)}
.lights{display:flex;gap:8px;margin-right:6px}.lights i{width:12px;height:12px;border-radius:50%;display:block}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.tb{height:28px;min-width:28px;padding:0 10px;border:1px solid transparent;border-radius:6px;background:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tb:hover{background:var(--hover)}.tb:disabled{opacity:.35;cursor:default;background:none}
.title{display:flex;flex-direction:column;min-width:0;margin-left:4px}
.title b{font-size:13px;white-space:nowrap}.crumb{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb a{color:var(--sub);text-decoration:none;cursor:pointer}.crumb a:hover{color:var(--accent)}
.activity{flex:1;display:flex;justify-content:center}
.act{min-width:260px;max-width:420px;height:26px;border-radius:7px;background:var(--side);display:flex;align-items:center;gap:8px;padding:0 10px;font-size:12px;color:var(--sub);cursor:pointer;border:none}
.act .bar{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}.act .bar span{display:block;height:100%;background:var(--accent);width:0}
.primary{background:var(--accent);color:#fff;border:none;border-radius:6px;height:28px;padding:0 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.tb{white-space:nowrap}
.primary:disabled{opacity:.4;cursor:default}
.split{display:inline-flex}.split .primary:first-child{border-radius:6px 0 0 6px}.split .primary:last-child{border-radius:0 6px 6px 0;border-left:1px solid rgba(255,255,255,.35);padding:0 8px}
.badge{background:var(--dot);color:#000;border-radius:9px;font-size:11px;padding:0 6px;font-weight:600}
/* body */
.body{display:grid;grid-template-columns:220px 1fr 280px;min-height:0}
.body.noinsp{grid-template-columns:220px 1fr 0}
.side{background:var(--side);border-right:1px solid var(--line);overflow:auto;padding:8px 8px 16px}
.search{width:100%;height:28px;border:1px solid var(--line);border-radius:7px;padding:0 9px;background:var(--field);color:var(--text);margin-bottom:8px}
.sh{font-size:11px;font-weight:600;color:var(--faint);margin:12px 8px 4px;letter-spacing:.02em}
.row{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:6px;cursor:pointer;user-select:none}
.row:hover{background:var(--hover)}.row.sel{background:var(--sel)}
.row .ic{width:18px;text-align:center}.row .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.child{padding-left:30px}.mod{width:7px;height:7px;border-radius:50%;background:var(--dot)}
.main{overflow:auto;min-width:0;display:flex;flex-direction:column}
.head{padding:18px 24px 0}.head h1{font-size:22px;margin:0;font-weight:700}.head .facts{color:var(--sub);margin-top:2px}
.seg{display:inline-flex;background:var(--side);border-radius:8px;padding:2px;margin:14px 0 0;gap:2px;flex-wrap:wrap}
.seg button{min-width:96px;height:28px;border:none;border-radius:6px;background:none;cursor:pointer;padding:0 12px}
.seg button.on{background:var(--win);box-shadow:0 1px 2px rgba(0,0,0,.15);font-weight:600}
.seg button:hover:not(.on){background:var(--hover)}
.content{padding:18px 24px 28px}
.insp{border-left:1px solid var(--line);overflow:auto;padding:16px;background:var(--win)}
.insp h3{margin:0 0 2px;font-size:15px}.insp .raw{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--sub);word-break:break-all}
.insp dl{margin:14px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 10px}.insp dt{color:var(--sub)}.insp dd{margin:0}
.insp p{margin:12px 0 0}
.pill{display:inline-block;border-radius:5px;padding:1px 7px;font-size:11px;background:var(--side);color:var(--sub)}
.pill.ok{background:rgba(31,138,59,.14);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
/* home */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tile{min-height:96px;border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;background:var(--win);text-align:left;display:flex;gap:12px;align-items:flex-start}
.tile:hover{border-color:var(--accent);background:var(--accent-soft)}.tile .big{font-size:24px;line-height:1}
.tile b{display:block;font-size:14px}.tile span{color:var(--sub);font-size:12px}
.tile.off{cursor:default;opacity:.7}.tile.off:hover{border-color:var(--line);background:var(--win)}
h2{font-size:15px;margin:24px 0 10px}h2:first-child{margin-top:0}
/* pickers */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;background:var(--win);text-align:left;position:relative}
.card:hover{border-color:var(--accent)}.card .thumb{height:64px;border-radius:6px;background:linear-gradient(135deg,var(--side),var(--line));display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:22px;margin-bottom:8px}
.card b{display:block}.card small{color:var(--sub)}.card .mod{position:absolute;top:8px;right:8px}
.bars{display:grid;grid-template-columns:auto 1fr;gap:2px 6px;margin-top:6px;font-size:10px;color:var(--sub);align-items:center}
.bars i{display:block;height:4px;border-radius:2px;background:var(--accent)}
/* form */
.group{border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
.ghead{width:100%;height:36px;display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--side);border:none;cursor:pointer;font-weight:600;text-align:left}
.ghead .cnt{color:var(--sub);font-weight:400}.ghead .chev{margin-left:auto;color:var(--sub)}
.field{display:grid;grid-template-columns:190px 1fr 96px 60px 28px;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--line);cursor:default}
.field.sel{background:var(--accent-soft)}.field .lab b{font-weight:500}.field .lab small{display:block;color:var(--faint);font:10px ui-monospace,Menlo,monospace}
.field input[type=range]{width:100%;accent-color:var(--accent)}
.field input[type=number],.field input[type=text]{width:100%;height:24px;border:1px solid var(--line);border-radius:5px;padding:0 6px;background:var(--field);color:var(--text);text-align:right}
.field .unit{color:var(--sub)}.rev{border:none;background:none;cursor:pointer;color:var(--accent);visibility:hidden;font-size:15px}.field.edited .rev{visibility:visible}
.field.edited .lab b::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--dot);margin-left:6px;vertical-align:middle}
.field.ro{color:var(--sub)}.field.ro input{opacity:.6}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;color:var(--sub);font-weight:600}tbody tr{cursor:pointer}tbody tr:hover{background:var(--hover)}tbody tr.sel{background:var(--sel)}
.reason{color:var(--sub);font-size:12px;margin-top:4px}.reason::before{content:"ⓘ ";color:var(--faint)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.btn{height:28px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--win);cursor:pointer}
.btn:hover:not(:disabled){background:var(--hover)}.btn:disabled{opacity:.45;cursor:default}
.split2{display:grid;grid-template-columns:260px 1fr;gap:18px}
.list{border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:520px}
.li{display:flex;gap:10px;align-items:center;min-height:44px;padding:6px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.li:hover{background:var(--hover)}.li.sel{background:var(--sel)}.li small{color:var(--sub);display:block}
.swatch{width:32px;height:32px;border-radius:6px;flex:none;border:1px solid var(--line)}
.stage{border:1px solid var(--line);border-radius:10px;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--sub);background:repeating-conic-gradient(var(--side) 0 25%,var(--win) 0 50%) 0 0/20px 20px}
.tilegrid{display:grid;grid-template-columns:repeat(16,1fr);gap:3px}.tilegrid div{aspect-ratio:1;border-radius:3px;background:linear-gradient(180deg,#7fb2ff,#cfe3ff);cursor:pointer;border:2px solid transparent}
.tilegrid div.cap{background:linear-gradient(180deg,#3d6fd6,#7fb2ff)}.tilegrid div.sel{border-color:var(--accent)}
.empty{max-width:420px;margin:80px auto;text-align:center}.empty b{display:block;font-size:17px;margin-bottom:12px}
/* bottom panel */
.bottom{border-top:1px solid var(--line);background:var(--win)}
.btabs{display:flex;gap:2px;padding:4px 8px;align-items:center}
.btabs button{height:26px;border:none;background:none;border-radius:6px;padding:0 10px;cursor:pointer;color:var(--sub)}
.btabs button.on{background:var(--side);color:var(--text);font-weight:600}.btabs .sp{flex:1}
.bpanel{height:150px;overflow:auto;border-top:1px solid var(--line);padding:0 8px}.bottom.closed .bpanel{display:none}
.job{display:grid;grid-template-columns:22px 1fr 220px 80px;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line)}
.job .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.job .bar span{display:block;height:100%;background:var(--accent)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.25);display:none;align-items:flex-start;justify-content:center;padding-top:120px}
.sheet{background:var(--win);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:min(460px,92vw);padding:20px}
.sheet h3{margin:0 0 12px}.sheet label{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:10px;margin:8px 0}
.sheet input,.sheet select{height:26px;border:1px solid var(--line);border-radius:5px;padding:0 6px;background:var(--field);color:var(--text)}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.menu{position:absolute;right:0;top:32px;background:var(--win);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:10px;width:300px;z-index:5;display:none}
.menu label{display:grid;grid-template-columns:70px 1fr;gap:8px;align-items:center;margin:6px 0}
.menu select{height:26px;border:1px solid var(--line);border-radius:5px;background:var(--field);color:var(--text)}
@media (max-width:900px){
  body{padding:8px}.window{height:auto;min-height:90vh}.body,.body.noinsp{grid-template-columns:1fr}
  .side{max-height:200px;border-right:none;border-bottom:1px solid var(--line)}.insp{border-left:none;border-top:1px solid var(--line)}
  .activity,.title .crumb{display:none}.field{grid-template-columns:1fr 70px 50px 24px}.field input[type=range]{display:none}
  .split2{grid-template-columns:1fr}.tilegrid{grid-template-columns:repeat(8,1fr)}.job{grid-template-columns:22px 1fr 60px}
  .job .bar{display:none}
}
</style>
</head>
<body>
<div class="window">
  <div class="toolbar">
    <div class="lights"><i></i><i></i><i></i></div>
    <button class="tb" id="btn-side" title="Show or hide the sidebar">◧</button>
    <button class="tb" id="back" title="Back">‹</button>
    <button class="tb" id="fwd" title="Forward">›</button>
    <div class="title"><b id="t-title">Home</b><div class="crumb" id="t-crumb"></div></div>
    <div class="activity"><button class="act" id="activity" title="Show jobs"><span id="act-text">Ready</span><span class="bar"><span id="act-bar"></span></span></button></div>
    <button class="tb" id="btn-changes" title="Changes">Changes <span class="badge" id="chg-count" hidden>0</span></button>
    <div style="position:relative">
      <div class="split"><button class="primary" id="btn-test">▶ Test Drive</button><button class="primary" id="btn-test-menu" title="Choose track, event and car">▾</button></div>
      <div class="menu" id="test-menu">
        <label>Track <select id="tm-track"></select></label>
        <label>Event <select id="tm-event"></select></label>
        <label>Car <select id="tm-car"></select></label>
      </div>
    </div>
    <button class="tb" id="btn-install" title="Build the mod and switch it on in the game">Install</button>
    <button class="tb" id="btn-insp" title="Show or hide the inspector">ⓘ</button>
  </div>
  <div class="body" id="body">
    <nav class="side" id="side"></nav>
    <main class="main"><div id="view"></div></main>
    <aside class="insp" id="insp"></aside>
  </div>
  <div class="bottom closed" id="bottom">
    <div class="btabs" id="btabs">
      <button data-tab="changes">Changes</button><button data-tab="issues">Issues</button><button data-tab="jobs">Jobs</button><button data-tab="log">Log</button>
      <span class="sp"></span><button id="bclose" title="Hide panel">▾</button>
    </div>
    <div class="bpanel" id="bpanel"></div>
  </div>
</div>
<div class="sheet-bg" id="sheet-bg"><div class="sheet" id="sheet"></div></div>

<script>
const D = JSON.parse(document.getElementById('kit-data').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => n == null ? 'Not sold' : '$' + Number(n).toLocaleString('en-US');
const S = {route:{v:'home'}, hist:[], fwd:[], changes:[], jobs:[], sel:null, btab:'changes', insp:true, side:true, testCar:'Bus', testTrack:'ANOKA.TRK'};
const CLASSES = ['Compact','Midsize','Muscle','Special','Trailer'];
const carBy = n => D.cars.find(c => c.name === n);
const trackBy = a => D.tracks.find(t => t.archive === a);

function go(route, why){ S.hist.push(S.route); S.fwd = []; S.route = Object.assign({}, route, why ? {why} : {}); S.sel = null; render(); }
$('#back').onclick = () => { if (!S.hist.length) return; S.fwd.push(S.route); S.route = S.hist.pop(); render(); };
$('#fwd').onclick = () => { if (!S.fwd.length) return; S.hist.push(S.route); S.route = S.fwd.pop(); render(); };
$('#btn-insp').onclick = () => { S.insp = !S.insp; $('#body').classList.toggle('noinsp', !S.insp); $('#insp').hidden = !S.insp; };
$('#btn-side').onclick = () => { S.side = !S.side; $('#side').hidden = !S.side; $('#body').style.gridTemplateColumns = S.side ? '' : (S.insp ? '0 1fr 280px' : '0 1fr 0'); };
$('#activity').onclick = () => openPanel('jobs');
$('#btn-changes').onclick = () => openPanel('changes');
$('#bclose').onclick = () => $('#bottom').classList.add('closed');
document.querySelectorAll('#btabs [data-tab]').forEach(b => b.onclick = () => openPanel(b.dataset.tab));
function openPanel(t){ S.btab = t; $('#bottom').classList.remove('closed'); renderPanel(); }

/* ------------------------------------------------------------------ sidebar */
function sidebar(){
  const r = S.route, rows = [];
  const row = (ic, n, route, sel, cls='', mod=false) => `<div class="row ${sel?'sel':''} ${cls}" data-go='${esc(JSON.stringify(route))}'><span class="ic">${ic}</span><span class="n">${esc(n)}</span>${mod?'<span class="mod"></span>':''}</div>`;
  rows.push(`<input class="search" placeholder="Search cars, tracks, files" id="search">`);
  rows.push(row('⌂','Home',{v:'home'}, r.v==='home'));
  rows.push('<div class="sh">MAKE</div>');
  rows.push(row('🚗','Cars',{v:'cars'}, r.v==='cars'));
  if (r.car) rows.push(row('', r.car, {v:'car', car:r.car, tab:r.tab||'handling'}, r.v==='car', 'child', hasChanges('car:'+r.car)));
  rows.push(row('🏁','Tracks',{v:'tracks'}, r.v==='tracks'));
  if (r.track) rows.push(row('', trackBy(r.track).name, {v:'track', track:r.track, tab:r.tab||'sky'}, r.v==='track', 'child'));
  rows.push(row('🏆','Career',{v:'career', tab:'dealer'}, r.v==='career', '', hasChanges('career')));
  rows.push(row('💾','Saves',{v:'saves'}, r.v==='saves'));
  rows.push(row('Aa','Text & Menus',{v:'text'}, r.v==='text'));
  rows.push(row('🔊','Sounds',{v:'sounds'}, r.v==='sounds'));
  rows.push('<div class="sh">MY MOD</div>');
  rows.push(row('📦', S.changes.length ? `${S.changes.length} change${S.changes.length>1?'s':''}, not installed` : 'No changes yet', {v:'mymod'}, r.v==='mymod'));
  rows.push('<div class="sh">GAME FILES</div>');
  rows.push(row('🗂','All archives',{v:'files'}, r.v==='files'));
  $('#side').innerHTML = rows.join('');
  $('#side').querySelectorAll('[data-go]').forEach(e => e.onclick = () => go(JSON.parse(e.dataset.go)));
  $('#search').oninput = e => searchRows(e.target.value);
}
function searchRows(q){
  q = q.trim().toLowerCase(); if (!q) return;
  const car = D.cars.find(c => c.name.toLowerCase().startsWith(q)); const tr = D.tracks.find(t => t.name.toLowerCase().startsWith(q));
  if (car) go({v:'car', car:car.name, tab:'handling'}, 'Search'); else if (tr) go({v:'track', track:tr.archive, tab:'sky'}, 'Search');
}
const hasChanges = obj => S.changes.some(c => c.obj === obj);

/* ------------------------------------------------------------------ toolbar state */
function toolbar(title, crumbs){
  $('#t-title').textContent = title;
  const why = S.route.why ? [{t:S.route.why}] : [];
  $('#t-crumb').innerHTML = [...why, ...crumbs].map(c => c.go ? `<a data-go='${esc(JSON.stringify(c.go))}'>${esc(c.t)}</a>` : esc(c.t)).join(' › ');
  $('#t-crumb').querySelectorAll('[data-go]').forEach(a => a.onclick = () => go(JSON.parse(a.dataset.go)));
  $('#back').disabled = !S.hist.length; $('#fwd').disabled = !S.fwd.length;
  const n = S.changes.length; $('#chg-count').hidden = !n; $('#chg-count').textContent = n;
  const r = S.route;
  const label = r.v === 'track' ? 'Test Race' : r.v === 'career' || r.v === 'saves' ? 'Test Career' : 'Test Drive';
  $('#btn-test').textContent = '▶ ' + label;
  if (r.car) S.testCar = r.car; if (r.track) S.testTrack = r.track;
  const testable = D.cars.filter(c => c.cls !== 'Trailer');
  $('#tm-car').innerHTML = testable.map(c => `<option ${c.name===S.testCar?'selected':''}>${esc(c.name)}</option>`).join('');
  $('#tm-track').innerHTML = D.tracks.filter(t => t.events.length || t.lines.length).map(t => `<option value="${t.archive}" ${t.archive===S.testTrack?'selected':''}>${esc(t.name)}</option>`).join('');
  fillEvents();
}
function fillEvents(){ const t = trackBy($('#tm-track').value) || D.tracks[0]; $('#tm-event').innerHTML = (t.events.length ? t.events : [{name:'Free practice'}]).map(e => `<option>${esc(e.name)}</option>`).join(''); }
$('#tm-track').onchange = () => { S.testTrack = $('#tm-track').value; fillEvents(); };
$('#tm-car').onchange = () => S.testCar = $('#tm-car').value;
$('#btn-test-menu').onclick = e => { const m = $('#test-menu'); m.style.display = m.style.display === 'block' ? 'none' : 'block'; e.stopPropagation(); };
document.addEventListener('click', e => { if (!e.target.closest('#test-menu') && e.target.id !== 'btn-test-menu') $('#test-menu').style.display = 'none'; });
$('#btn-test').onclick = () => startJob(`${$('#btn-test').textContent.slice(2)} · ${S.testCar} on ${trackBy(S.testTrack).name}`, ['Building the mod','Starting the game','Running'], 'profile:dev');
$('#btn-install').onclick = () => {
  if (!S.changes.length) { log('Nothing to install: no changes in this mod yet.'); openPanel('log'); return; }
  startJob(`Install mod · ${S.changes.length} change${S.changes.length>1?'s':''}`, ['Building the mod','Installing in the game','Switching it on'], 'project');
};

/* ------------------------------------------------------------------ jobs (never block the UI) */
function startJob(label, steps, lock){
  const j = {label, steps, step:0, p:0, lock, state:'running', id:Date.now()}; S.jobs.unshift(j); openPanel('jobs');
  const tick = setInterval(() => {
    if (j.state !== 'running') { clearInterval(tick); return; }
    j.p += 4 + Math.random()*6; if (j.p >= 100) { j.p = 0; j.step++; }
    if (j.step >= steps.length) { j.state = 'done'; j.p = 100; clearInterval(tick); log(label + ': finished.'); }
    activity(); if (S.btab === 'jobs') renderPanel(); if (S.route.v === 'car' || S.route.v === 'career') renderLocks();
  }, 160);
  activity();
}
function activity(){
  const j = S.jobs.find(j => j.state === 'running');
  $('#act-text').textContent = j ? `${j.label.split(' · ')[0]} · ${j.steps[j.step]}` : 'Ready';
  $('#act-bar').style.width = j ? ((j.step*100 + j.p) / j.steps.length) + '%' : '0';
}
const locked = () => S.jobs.some(j => j.state === 'running' && j.lock === 'project');
function renderLocks(){ document.querySelectorAll('[data-edit]').forEach(i => { i.disabled = locked() || i.dataset.ro === '1'; i.title = locked() ? 'Read-only while the mod builds. Edits return when it finishes.' : ''; }); }
const logs = [];
function log(t){ logs.unshift(new Date().toLocaleTimeString() + '  ' + t); if (S.btab === 'log') renderPanel(); }

function renderPanel(){
  document.querySelectorAll('#btabs [data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === S.btab));
  const p = $('#bpanel');
  if (S.btab === 'changes') {
    p.innerHTML = S.changes.length ? `<table><thead><tr><th>Object</th><th>Value</th><th>Before</th><th>After</th><th></th></tr></thead><tbody>${S.changes.map((c,i) =>
      `<tr><td>${esc(c.objLabel)}</td><td>${esc(c.label)} <span class="pill">${esc(c.raw)}</span></td><td>${esc(c.before)}</td><td><b>${esc(c.after)}</b></td><td><button class="btn" data-rev="${i}">Revert</button></td></tr>`).join('')}</tbody></table>`
      : '<p style="color:var(--sub);padding:10px">No changes. Edits appear here as you make them.</p>';
    p.querySelectorAll('[data-rev]').forEach(b => b.onclick = () => { S.changes.splice(+b.dataset.rev, 1); render(); renderPanel(); });
  } else if (S.btab === 'jobs') {
    p.innerHTML = S.jobs.length ? S.jobs.map(j => `<div class="job"><span>${j.state==='done'?'✓':'⟳'}</span><div><b>${esc(j.label)}</b><div class="reason" style="margin:0">${j.state==='done'?'Done':esc(j.steps[j.step])} · holds ${j.lock==='project'?'this mod':'the test game profile'}</div></div><div class="bar"><span style="width:${(j.state==='done'?100:(j.step*100+j.p)/j.steps.length)}%"></span></div>${j.state==='running'?`<button class="btn" data-cancel="${j.id}">Cancel</button>`:'<span></span>'}</div>`).join('')
      : '<p style="color:var(--sub);padding:10px">No jobs running.</p>';
    p.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => { const j = S.jobs.find(x => x.id == b.dataset.cancel); j.state = 'done'; j.steps[j.step] = 'Cancelled'; log(j.label + ': cancelled.'); activity(); renderPanel(); renderLocks(); });
  } else if (S.btab === 'issues') {
    const busNoDealer = S.changes.some(c => c.raw === 'put on sale');
    p.innerHTML = `<p style="padding:10px;color:var(--sub)">${busNoDealer ? 'No problems found. The new dealer car has a class, a price, ratings and paint.' : 'No problems found.'}</p>`;
  } else {
    p.innerHTML = `<pre style="font:11px ui-monospace,Menlo,monospace;color:var(--sub);padding:8px;margin:0">${esc(logs.join('\n') || 'Log is empty.')}</pre>`;
  }
}

const conf = c => c === 'high' ? '<span class="pill ok">Confirmed in the game\'s code</span>' : c === 'medium' ? '<span class="pill">From the game\'s code</span>' : '<span class="pill warn">Best guess</span>';

function fieldId(c, f){ return 'car:' + c.name + ':' + f.section + ':' + f.key; }
function current(c, f){ const ch = S.changes.find(x => x.id === fieldId(c, f)); return ch ? ch.after : f.value; }
function rangeFor(f){
  const v = parseFloat(f.value); const o = f.observed || [v, v];
  let lo = Math.min(o[0], v), hi = Math.max(o[1], v); const span = (hi - lo) || Math.abs(hi) || 1;
  lo = Math.max(lo >= 0 ? 0 : -Infinity, lo - span*.5); hi = hi + span*.5; return [lo, hi];
}
function handlingView(c){
  const groups = {};
  c.handling.forEach(f => (groups[f.group] = groups[f.group] || []).push(f));
  const gear = c.gears.length ? `<div class="group"><button class="ghead">Gear ratios <span class="cnt">${c.gears.length} gears</span></button>${c.gears.map((g,i) => `<div class="field"><span class="lab"><b>Gear ${i+1}</b><small>[Transmission] g${i+1}</small></span><span></span><input type="number" step="0.01" value="${esc(g)}" data-edit data-ro="0"><span class="unit">ratio</span><span></span></div>`).join('')}</div>` : '';
  return Object.entries(groups).map(([g, fs]) => `<div class="group"><button class="ghead" data-g>${esc(g)} <span class="cnt">${fs.length} value${fs.length>1?'s':''}</span><span class="chev">⌃</span></button>
    ${fs.map(f => { const v = current(c, f), num = !isNaN(parseFloat(v)) && !/,/.test(v); const [lo, hi] = num ? rangeFor(f) : [0,1];
      const edited = v !== f.value;
      return `<div class="field ${edited?'edited':''} ${S.sel===fieldId(c,f)?'sel':''}" data-f="${esc(f.section+'|'+f.key)}">
        <span class="lab"><b>${esc(f.label)}</b><small>[${esc(f.section)}] ${esc(f.key)}</small></span>
        ${num ? `<input type="range" min="${lo}" max="${hi}" step="${(hi-lo)/200}" value="${parseFloat(v)}" data-edit data-ro="0">` : '<span></span>'}
        <input type="${num?'number':'text'}" value="${esc(v)}" data-edit data-ro="0" ${num?`step="${Math.abs(parseFloat(v))>=100?1:0.01}"`:''}>
        <span class="unit">${esc(f.unit)}</span><button class="rev" title="Revert to ${esc(f.value)}">⟲</button></div>`; }).join('')}</div>`).join('') + gear +
    (c.unused.length ? `<div class="group"><button class="ghead">Values the game does not read <span class="cnt">${c.unused.length} shown</span></button>${c.unused.map(u => `<div class="field ro"><span class="lab"><b>${esc(u.label)}</b><small>${esc(u.key)}</small></span><span></span><input type="text" value="${esc(u.value)}" data-edit data-ro="1"><span class="unit"></span><span></span></div>`).join('')}
      <div class="reason" style="padding:0 14px 10px">Changing these has no effect in the game.</div></div>` : '') +
    `<button class="btn" disabled>All values…</button><div class="reason">Every value of this car's physics sheet in one searchable table (Game Files).</div>`;
}
function wireCar(c, tab){
  document.querySelectorAll('.ghead[data-g]').forEach(h => h.onclick = () => { const g = h.parentElement; const hidden = g.classList.toggle('shut'); g.querySelectorAll('.field').forEach(f => f.hidden = hidden); h.querySelector('.chev').textContent = hidden ? '⌄' : '⌃'; });
  document.querySelectorAll('.field[data-f]').forEach(row => {
    const [sec, key] = row.dataset.f.split('|'); const f = c.handling.find(x => x.section === sec && x.key === key);
    const show = () => { S.sel = fieldId(c, f); document.querySelectorAll('.field').forEach(x => x.classList.toggle('sel', x === row)); inspectField(c, f); };
    row.onclick = show;
    const range = row.querySelector('input[type=range]'), box = row.querySelector('input[type=number],input[type=text]');
    const commit = val => { setChange(c, f, String(val)); row.classList.toggle('edited', String(val) !== f.value); show(); toolbar(c.name, [{t:'Cars', go:{v:'cars'}}, {t:c.name}, {t:'Handling'}]); sidebar(); if (S.btab==='changes') renderPanel(); };
    if (range) range.oninput = () => { box.value = (+range.value).toFixed(Math.abs(+range.value) >= 100 ? 0 : 2); commit(box.value); };
    box.onchange = () => { if (range) range.value = box.value; commit(box.value); };
    row.querySelector('.rev').onclick = e => { e.stopPropagation(); S.changes = S.changes.filter(x => x.id !== fieldId(c, f)); render(); };
  });
  if (tab === 'paint') document.querySelectorAll('.li[data-liv]').forEach(li => li.onclick = () => { document.querySelectorAll('.li').forEach(x => x.classList.toggle('sel', x === li)); const n = li.dataset.liv;
    inspector(`<h3>Livery ${n}</h3><div class="raw">CT.RES#${n}.tex · CT.RES#${n}.tm0</div><dl><dt>Car</dt><dd>${esc(c.name)}</dd><dt>Used by</dt><dd>Dealer paint ${c.variants.indexOf(+n)+1} of ${c.variants.length}</dd></dl><p>Replacing it changes this paint wherever the game draws vehicle ${n}.</p>`);
    $('#livnum').textContent = 'Livery ' + n; });
}
function setChange(c, f, val){
  const id = fieldId(c, f); S.changes = S.changes.filter(x => x.id !== id);
  if (val !== f.value) S.changes.push({id, obj:'car:'+c.name, objLabel:c.name+' · Handling', label:f.label, raw:`[${f.section}] ${f.key}`, before:f.value, after:val});
}
function inspectField(c, f){
  const v = current(c, f);
  inspector(`<h3>${esc(f.label)}</h3><div class="raw">physics.val [${esc(f.section)}] ${esc(f.key)}</div>
    <dl><dt>Value</dt><dd>${esc(v)} ${esc(f.unit)}</dd><dt>Original</dt><dd>${esc(f.value)} ${esc(f.unit)}</dd>${f.observed?`<dt>Retail cars</dt><dd>${f.observed[0]} to ${f.observed[1]} ${esc(f.unit)}</dd>`:''}</dl>
    <p>${esc(f.explanation)}</p><p>${conf(f.confidence)}</p>
    <p class="reason">Shared with no other car: each car has its own physics sheet.</p>`);
}
function paintView(c){
  if (!c.variants.length) return `<div class="split2"><div class="list">${c.cls==='Trailer'?'':`<div class="li sel"><span class="swatch" style="background:#e9c400"></span><div>AI paints<small>This car races only as a computer car</small></div></div>`}</div>
    <div><div class="stage"><b>${esc(c.name)} paint</b><span>${c.cls==='Trailer'?'Trailers carry no livery of their own.':'Its paints are the computer drivers\' liveries.'}</span></div></div></div>`;
  return `<div class="split2"><div class="list">${c.variants.map((n,i) => `<div class="li ${i===0?'sel':''}" data-liv="${n}"><span class="swatch" style="background:hsl(${n*47%360} 60% 50%)"></span><div>Livery ${n}<small>Dealer paint ${i+1}</small></div></div>`).join('')}</div>
    <div><div class="stage"><b id="livnum">Livery ${c.variants[0]}</b><span>Before · After · On the car</span></div>
    <div class="btns"><button class="primary">Replace with Image…</button><button class="btn">Export PNG…</button><button class="btn" disabled>Revert</button></div>
    <div class="reason">Any size works. The same size stays a native texture; a larger image is used as a high-resolution replacement.</div></div></div>`;
}
function modelView(c){

    ${c.cls==='Trailer'?'<div class="reason">Trailers cannot become drivable cars.</div>':''}</div></div>`;

function lineName(f){
  const base = f.replace('.ild','');
  const m = base.match(/^(rr|opt\d)?(bw_)?(.*)$/); const kind = {oval:'Oval', fig8:'Figure 8', track:'Full course'}[m[3]] || m[3];
  return `${m[1]==='rr'?'Road race ':m[1]?'Home option '+m[1].slice(3)+' ':''}${kind}${m[2]?' (reverse)':''}`;
}

  if (tab === 'special') {
    const specials = D.cars.filter(c => c.cls === 'Special');
    b = `<table><thead><tr><th>Vehicle</th><th>In retail</th><th></th></tr></thead><tbody>${specials.map(c => `<tr class="${r.pick===c.name?'sel':''}"><td><b>${esc(c.name)}</b></td><td>Computer drivers and special Eves only</td><td>${onSale.includes(c.name) ? '<span class="pill ok">On sale</span>' : `<button class="btn" data-sell="${esc(c.name)}">Put on Sale…</button>`}</td></tr>`).join('')}
      <tr class="${r.pick==='Boat'?'sel':''}"><td><b>Boat</b></td><td>A boat on a trailer, towed in trailer races</td><td><button class="btn" disabled>Put on Sale…</button><div class="reason">A drivable boat needs a new vehicle with its own physics and model, which the Kit can't build yet.</div></td></tr></tbody></table>`;
  }
  if (tab === 'eves') { const home = trackBy('HOMEBASE.TRK'); b = `<table><thead><tr><th>Event</th><th>Type</th><th>Laps</th><th>Cars</th></tr></thead><tbody>${D.tracks.flatMap(t => t.events.map(e => `<tr><td>${esc(e.name)}</td><td>${esc(e.type.replace(/_/g,' '))}</td><td>${esc(e.laps)}</td><td>${esc(e.cars)}</td></tr>`)).slice(0, 60).join('')}</tbody></table>`; }
  if (tab === 'upgrades') b = `<table><thead><tr><th>Part</th><th>Kind</th><th>Fits</th><th>Price</th></tr></thead><tbody>${D.catalog.map(p => `<tr><td>${esc(p.name)}</td><td>${esc(p.kind)}</td><td>${esc(p.fits)}</td><td>${money(p.price)}</td></tr>`).join('')}</tbody></table>`;
  $('#view').innerHTML = header('Career', 'Dealer, events and upgrades of the Career mode', tabs, tab) + `<div class="content">${b}</div>`;
  wireTabs();
  document.querySelectorAll('[data-sell]').forEach(bt => bt.onclick = () => sellSheet(bt.dataset.sell));
  document.querySelectorAll('tr[data-car]').forEach(tr => tr.onclick = () => { document.querySelectorAll('tr').forEach(x => x.classList.toggle('sel', x === tr)); const c = carBy(tr.dataset.car);
    inspector(`<h3>${esc(c.name)}</h3><div class="raw">buycar.val [car] · car_stats.val · carclass.val</div><dl><dt>Price</dt><dd>${money(c.price)}</dd><dt>Class</dt><dd>${c.cls}</dd><dt>Paints</dt><dd>${c.variants.join(', ')}</dd></dl><p>The class decides which upgrade parts fit and which Eves the car can enter.</p><div class="btns"><button class="btn" onclick="go({v:'car',car:'${esc(c.name)}',tab:'handling'})">Open ${esc(c.name)}</button></div>`); });
  if (r.pick === 'Bus' && !onSale.includes('Bus')) setTimeout(() => sellSheet('Bus'), 150);
  inspector();
};
function sellSheet(name){
  const c = carBy(name);
  $('#sheet').innerHTML = `<h3>Put ${esc(name)} on sale</h3>
    <label>Dealer name <input value="${name==='Bus'?'Schoolbus':esc(name)}"></label>
    <label>Class <select><option>Compact</option><option selected>Midsize</option><option>Muscle</option></select></label>
    <label>Price <input value="280" style="width:100px"> </label>
    <label>Ratings <span>Speed ${c.stats.speed} · Handling ${c.stats.handling} · Durability ${c.stats.durability}</span></label>
    <div class="reason">Adds a copy of ${esc(name)} with its original physics, model and paint. The ${esc(name)} in special Eves stays as it is.</div>
    <div class="foot"><button class="btn" id="sh-cancel">Cancel</button><button class="primary" id="sh-ok">Put on Sale</button></div>`;
  $('#sheet-bg').style.display = 'flex';
  $('#sh-cancel').onclick = () => $('#sheet-bg').style.display = 'none';
  $('#sh-ok').onclick = () => { $('#sheet-bg').style.display = 'none'; S.changes.push({id:'sell:'+name, obj:'career', objLabel:'Career · Dealer', label:name+' on sale', raw:'put on sale', car:name, before:'Not sold', after:'$280'}); S.route = {v:'career', tab:'dealer', why:S.route.why}; render(); };
}

VIEWS.saves = () => {
  toolbar('Saves', [{t:'Saves'}]);
  const fields = [['Money','$'],['Reputation',''],['Garage car 1',''],['Garage car 2',''],['Garage car 3',''],['Garage car 4','']];
  $('#view').innerHTML = header('Saves', 'Career saves on the game\'s memory card') + `<div class="content">
    <div class="list" style="max-height:none;margin-bottom:16px"><div class="li sel"><span class="swatch" style="background:var(--side)">💾</span><div>Career save<small>Game memory card · slot 1</small></div></div><div class="li"><span class="swatch" style="background:var(--side)">🧪</span><div>Test career<small>The Kit's own test memory card</small></div></div></div>
    <div class="group">${fields.map(([l,u]) => `<div class="field" style="grid-template-columns:190px 1fr 60px"><span class="lab"><b>${l}</b></span><input type="text" placeholder="Read from the save" data-edit data-ro="0"><span class="unit">${u}</span></div>`).join('')}
    <div class="field ro" style="grid-template-columns:190px 1fr"><span class="lab"><b>Garage car 5</b></span><span class="reason" style="margin:0">The save holds four cars.</span></div></div>
    <div class="btns"><button class="primary">Save to Card</button></div><div class="reason">The file is backed up before it is written, and its checksum is rewritten.</div></div>`;
  inspector();
};
VIEWS.text = () => { toolbar('Text & Menus', [{t:'Text & Menus'}]); $('#view').innerHTML = header('Text & Menus', 'Menu words, messages and menu images', [['s','Strings'],['i','Menu Images'],['l','Layouts']], 's') + `<div class="content"><input class="search" style="max-width:320px" placeholder="Search text"><table><thead><tr><th>Where</th><th>Text</th></tr></thead><tbody><tr><td>Main menu</td><td>QUICK RACE</td></tr><tr><td>Main menu</td><td>CAREER</td></tr></tbody></table></div>`; wireTabs(); inspector(); };
VIEWS.sounds = () => { toolbar('Sounds', [{t:'Sounds'}]); $('#view').innerHTML = header('Sounds', 'Engine sounds, effects and music') + `<div class="content"><div class="empty"><b>Pick a car to hear its engine.</b><button class="primary" onclick="go({v:'cars'})">Choose a Car</button></div></div>`; inspector(); };
VIEWS.mymod = () => { toolbar('My Mod', [{t:'My Mod'}]); $('#view').innerHTML = header('My Mod', S.changes.length ? `${S.changes.length} changes · not installed` : 'No changes yet') + `<div class="content"><div class="btns"><button class="primary" onclick="$('#btn-install').click()" ${S.changes.length?'':'disabled'}>Install</button><button class="btn" ${S.changes.length?'':'disabled'}>Share as One File…</button></div><div class="reason">One .eodmod file. Double-clicking it opens it in the Kit.</div></div>`; inspector(); };
VIEWS.files = () => { toolbar('Game Files', [{t:'Game Files'}]); $('#view').innerHTML = header('Game Files', 'Every archive on the disc, as the game stores it') + `<div class="content"><div class="btns"><button class="primary" onclick="startJob('Export all textures', ['Reading archives','Writing PNG files'], 'export')">Export All Textures…</button></div><table><thead><tr><th>Archive</th><th>Kind</th></tr></thead><tbody>${D.cars.map(c => `<tr><td>DATA/CAR/${esc(c.archive)}</td><td>Car</td></tr>`).join('')}${D.tracks.map(t => `<tr><td>DATA/TRACKS/${esc(t.archive)}</td><td>Track</td></tr>`).join('')}</tbody></table></div>`; inspector('<h3>Game Files</h3><p>Exports keep running while you work anywhere else in the Kit.</p>'); };

render();
</script>
</body>
</html>
